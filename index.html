<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Driver Dispatcher</title>
<style>
:root{
  --bg:#141c24;--panel:#1d2832;--panel2:#26333f;--line:#364653;--text:#eef3f6;--muted:#9fb0bc;
  --amber:#ffc24b;--good:#4fd18b;--bad:#ff6b5e;
  --home:#009E73;--office:#0072B2;--school:#CC79A7;--shop:#E69F00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;height:100vh;min-height:0}
#mapWrap{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px}
svg#map{width:100%;height:100%;max-height:100%;display:block;user-select:none;touch-action:manipulation}
#panel{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;margin:0;letter-spacing:.2px}
h2{font-size:11px;margin:0 0 7px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.board{background:#0d1319;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
.board b{color:var(--amber);font-size:22px;font-weight:700}
.board span{color:var(--muted);font-size:12px}
#event{font-size:12px;color:var(--amber);margin-top:6px;min-height:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.stats div{display:flex;justify-content:space-between}
.stats b{font-variant-numeric:tabular-nums}
.meter{height:9px;background:#0d1319;border-radius:5px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;width:70%;background:var(--good);transition:width .25s}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer}
button:hover:not(:disabled){background:#32424f}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.speed{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.speed button.on{background:var(--amber);color:#1b1408;border-color:var(--amber);font-weight:700}
.route{display:grid;grid-template-columns:12px 1fr auto;gap:4px 8px;align-items:center;background:var(--panel2);border-radius:7px;padding:7px 8px;margin-bottom:6px}
.route .sw{width:12px;height:12px;border-radius:3px}
.route small{color:var(--muted)}
.route .warn{color:var(--bad)}
.route .ctl{display:flex;gap:3px;align-items:center}
.route .ctl button{padding:1px 8px}
.route .act{grid-column:2/4;display:flex;gap:5px}
.route .act button{padding:2px 8px;font-size:12px}
#noRoutes{color:var(--muted);font-size:13px}
.shop button{display:flex;justify-content:space-between;width:100%;margin-bottom:5px;text-align:left}
.shop button b{color:var(--amber);font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);max-width:calc(100% - 32px);background:#0d1319ee;border:1px solid var(--line);border-radius:8px;padding:7px 12px;display:flex;gap:9px;align-items:center;z-index:2;font-size:13px}
#hint:empty{display:none}
#hint button{padding:2px 9px;font-size:12px}
#modalBack{position:fixed;inset:0;background:#070b10b8;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:470px;width:100%;max-height:90vh;overflow:auto;padding:22px}
#modal h2{font-size:21px;color:var(--text);text-transform:none;letter-spacing:0;margin-bottom:10px}
#modal ul{padding-left:20px;margin:10px 0}
#modal li{margin-bottom:6px}
#modal table{width:100%;border-collapse:collapse;margin:10px 0}
#modal td{padding:3px 0}
#modal td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
#modal .primary{background:var(--amber);color:#1b1408;border-color:var(--amber);font-weight:700;padding:9px 16px;margin-top:8px;width:100%}
.stopHit{cursor:pointer}
.stopBody{transition:r .1s}
.stop:hover .stopBody{r:18px}
.float{animation:floatUp .9s ease-out forwards;font-weight:700;font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
.newPulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.float,.newPulse{animation-duration:.01s}}
@media (max-width:820px){
  #app{flex-direction:column;height:auto}
  #mapWrap{padding:8px 16px;flex:none}
  svg#map{height:auto}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line);overflow:visible;padding:14px 16px}
  #hint{position:static;transform:none;margin-bottom:0}
  #mapWrap{flex-direction:column;gap:6px}
}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <div id="hint"></div>
    <svg id="map" viewBox="0 0 1000 680" role="img" aria-label="Town map with bus stops and routes"></svg>
  </div>
  <aside id="panel">
    <div>
      <h1>🚌 Bus Driver Dispatcher</h1>
      <div class="board" style="margin-top:9px"><div><span>DAY</span> <b id="day">1</b></div><b id="clock">05:00</b></div>
      <div id="event"></div>
    </div>
    <div>
      <div class="stats">
        <div><span>Cash</span><b id="cash">$0</b></div>
        <div><span>Waiting</span><b id="waiting">0</b></div>
        <div><span>Delivered</span><b id="delivered">0</b></div>
        <div><span>Gave up</span><b id="gaveUp">0</b></div>
      </div>
      <div style="margin-top:9px;display:flex;justify-content:space-between"><span>Town approval</span><b id="ratingTxt">70%</b></div>
      <div class="meter"><i id="ratingBar"></i></div>
    </div>
    <div>
      <h2>Speed <small style="text-transform:none;letter-spacing:0">(Space pauses)</small></h2>
      <div class="speed" id="speed">
        <button data-s="0" aria-label="Pause">⏸</button>
        <button data-s="1" aria-label="Normal speed">▶</button>
        <button data-s="2" aria-label="Double speed">▶▶</button>
        <button data-s="3" aria-label="Triple speed">▶▶▶</button>
      </div>
    </div>
    <div>
      <h2>Routes <span id="busCount" style="float:right;text-transform:none;letter-spacing:0"></span></h2>
      <div id="routes"></div>
    </div>
    <div class="shop">
      <h2>Depot</h2>
      <button id="buyBus"></button>
      <button id="buyCap"></button>
      <button id="buySpeed"></button>
    </div>
    <div>
      <h2>Passenger destinations</h2>
      <div class="legend">
        <div><i style="background:var(--home)"></i>🏠 Homes</div>
        <div><i style="background:var(--office)"></i>🏢 Offices</div>
        <div><i style="background:var(--school)"></i>🏫 Schools</div>
        <div><i style="background:var(--shop)"></i>🛒 Shops</div>
      </div>
    </div>
  </aside>
</div>
<div id="modalBack"><div id="modal" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
const W=1000,H=680,CELL=80,MARGIN=60,COLS=12,ROWS=8,DAY=120,FARE=3,UPKEEP=8,MAX_ROUTES=6,MAX_STOPS=28;
const TYPES={
  home:{label:'Homes',emoji:'🏠',color:'#009E73',weight:40},
  office:{label:'Offices',emoji:'🏢',color:'#0072B2',weight:25},
  school:{label:'Schools',emoji:'🏫',color:'#CC79A7',weight:15},
  shop:{label:'Shops',emoji:'🛒',color:'#E69F00',weight:20}
};
const ROUTE_COLORS=['#d62839','#2a6fdb','#2a9d4a','#8e44ad','#e07a00','#0f9aa8'];
const STREETS=['Maple','Oak','Birch','Cedar','Elm','Pine','Willow','Ash','Hazel','Juniper','Linden','Poplar','Rowan','Spruce','Alder','Holly','Laurel','Aspen','Chestnut','Sycamore','Magnolia','Hawthorn','Beech','Walnut','Fir','Larch','Olive','Yew'];
const SUFFIX=['St','Ave','Rd','Ln','Way'];
const EVENTS=[
  {id:'clear',name:'☀️ Clear skies',desc:'A normal day. Enjoy it.'},
  {id:'clear',name:'☀️ Clear skies',desc:'A normal day. Enjoy it.'},
  {id:'rain',name:'🌧️ Rainstorm',desc:'Buses drive 20% slower and more people want a ride.'},
  {id:'festival',name:'🎪 Street festival',desc:'Crowds pour out of one shop stop from 11:00 to 16:00.'},
  {id:'payday',name:'💰 Payday',desc:'Fares are worth 50% more today.'}
];
const $=id=>document.getElementById(id);
const SVGNS='http://www.w3.org/2000/svg';
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function el(tag,attrs,parent){
  const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}
function weighted(w){
  let sum=0;for(const k in w)sum+=w[k];
  if(sum<=0)return null;
  let r=Math.random()*sum;
  for(const k in w){r-=w[k];if(r<=0)return k;}
  return Object.keys(w)[0];
}
function readBest(){try{return +localStorage.getItem('busDispatcherBest')||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem('busDispatcherBest',v)}catch(e){}}

/* ---------- SVG layers ---------- */
const svg=$('map');
const layers={};
['ground','routes','preview','tint','stops','buses','fx'].forEach(n=>layers[n]=el('g',{},svg));
function drawGround(){
  const g=layers.ground;g.innerHTML='';
  el('rect',{x:0,y:0,width:W,height:H,fill:'#b9b7ac'},g);
  for(let c=-1;c<COLS;c++)for(let r=-1;r<ROWS;r++){
    const x=MARGIN+c*CELL+6,y=MARGIN+r*CELL+6,s=CELL-12,roll=Math.random();
    el('rect',{x,y,width:s,height:s,rx:6,fill:roll<.14?'#c9dfb4':'#ecebdf'},g);
    if(roll<.14){
      for(let i=0;i<4;i++)el('circle',{cx:x+rand(12,s-12),cy:y+rand(12,s-12),r:rand(5,9),fill:'#8fbb7c'},g);
    }else{
      const n=2+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const w=rand(11,20),h=rand(11,20);
        el('rect',{x:x+rand(5,s-w-5),y:y+rand(5,s-h-5),width:w,height:h,rx:2,fill:pick(['#dcdacb','#d6d2c2','#e0d6c8','#d3d7d2'])},g);
      }
    }
  }
}
const tintRect=el('rect',{x:0,y:0,width:W,height:H,fill:'#0b1a3a',opacity:0,'pointer-events':'none'},layers.tint);

/* ---------- State ---------- */
let G;
function newGame(){
  G={day:1,t:0,now:0,cash:100,rating:70,stops:[],routes:[],fleet:[],owned:2,capLevel:0,speedLevel:0,
     speed:1,lastSpeed:1,delivered:0,gaveUp:0,earned:0,dayStats:{delivered:0,gaveUp:0,earned:0},
     spawnAcc:0,festAcc:0,event:EVENTS[0],festStop:null,draw:null,hover:null,started:false,over:false,modal:false,dist:{},
     names:[...STREETS].sort(()=>Math.random()-.5),nextRoute:1};
  layers.routes.innerHTML=layers.stops.innerHTML=layers.buses.innerHTML=layers.preview.innerHTML=layers.fx.innerHTML='';
  drawGround();
  ['home','home','office','school','shop'].forEach(addStop);
  renderRoutesPanel();updateHint();setSpeed(1);
}
const capacity=()=>8+G.capLevel*4;
const busSpeed=()=>85*(1+G.speedLevel*.15)*(G.event.id==='rain'?.8:1);
const assigned=()=>G.fleet.length;
const freeBuses=()=>G.owned-assigned();
const busCost=()=>50+15*G.owned;
const capCost=()=>150*(G.capLevel+1);
const speedCost=()=>120*(G.speedLevel+1);
const hour=()=>5+G.t/DAY*18;

/* ---------- Stops ---------- */
function findSpot(type){
  const cx=(COLS-1)/2,cy=(ROWS-1)/2;let best=null,bestScore=-Infinity;
  for(let i=0;i<40;i++){
    const c=Math.floor(Math.random()*COLS),r=Math.floor(Math.random()*ROWS);
    if(G.stops.some(s=>Math.abs(s.c-c)+Math.abs(s.r-r)<3))continue;
    const center=Math.hypot(c-cx,r-cy);
    const pull=type==='office'?-center:type==='home'?center*.6:0;
    const score=pull+Math.random()*2;
    if(score>bestScore){bestScore=score;best={c,r};}
  }
  if(best)return best;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)if(!G.stops.some(s=>Math.abs(s.c-c)+Math.abs(s.r-r)<2))return {c,r};
  return null;
}
function addStop(type){
  const spot=findSpot(type);if(!spot)return null;
  const name=(G.names.pop()||'New')+' '+pick(SUFFIX);
  const s={id:G.stops.length,c:spot.c,r:spot.r,x:MARGIN+spot.c*CELL,y:MARGIN+spot.r*CELL,type,name,wait:[],routes:[],grace:G.now+25,dirty:true};
  const g=el('g',{class:'stop',transform:`translate(${s.x} ${s.y})`},layers.stops);
  s.pulse=el('circle',{r:25,fill:'none',stroke:'#ffc24b','stroke-width':3,class:'newPulse'},g);
  if(G.day===1)s.pulse.remove(),s.pulse=null;
  s.ring=el('circle',{r:20,fill:'none',stroke:'#e0322b','stroke-width':4,pathLength:1,'stroke-dasharray':'0 1',transform:'rotate(-90)'},g);
  el('circle',{class:'stopBody',r:15,fill:'#fff',stroke:TYPES[type].color,'stroke-width':4},g);
  const t=el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':15,'pointer-events':'none'},g);t.textContent=TYPES[type].emoji;
  const label=el('text',{y:33,'text-anchor':'middle','font-size':11,'font-weight':600,fill:'#39424a','pointer-events':'none',style:'paint-order:stroke;stroke:#ecebdfcc;stroke-width:3px'},g);label.textContent=name;
  s.waitG=el('g',{'pointer-events':'none'},g);
  const hit=el('circle',{class:'stopHit',r:27,fill:'transparent'},g);
  const title=el('title',{},hit);title.textContent=`${name} (${TYPES[type].label})`;
  hit.addEventListener('click',()=>clickStop(s));
  hit.addEventListener('pointerenter',()=>{G.hover=s;drawPreview();});
  hit.addEventListener('pointerleave',()=>{if(G.hover===s)G.hover=null;drawPreview();});
  G.stops.push(s);
  recomputeNetwork();
  return s;
}
function renderWaiting(s){
  s.dirty=false;s.waitG.innerHTML='';
  const flip=s.x>W-110, n=Math.min(s.wait.length,15);
  for(let i=0;i<n;i++){
    const dx=(23+(i%5)*10)*(flip?-1:1),dy=-11+Math.floor(i/5)*10;
    el('circle',{cx:dx,cy:dy,r:4.4,fill:TYPES[s.wait[i].dest].color,stroke:'#fff','stroke-width':1},s.waitG);
  }
  if(s.wait.length>15){
    const t=el('text',{x:flip?-23:23,y:29,'text-anchor':flip?'end':'start','font-size':11,'font-weight':700,fill:'#b3261e',style:'paint-order:stroke;stroke:#fff;stroke-width:3px'},s.waitG);
    t.textContent='+'+(s.wait.length-15);
  }
}

/* ---------- Routes ---------- */
function buildRoutePath(r){
  const o=(r.slot-2.5)*3.5;
  const pts=[{x:r.stops[0].x+o,y:r.stops[0].y+o}],marks=[0];let len=0;
  const push=(x,y)=>{const p=pts[pts.length-1],d=Math.abs(x-p.x)+Math.abs(y-p.y);if(d>0){pts.push({x,y});len+=d;}};
  for(let i=1;i<r.stops.length;i++){
    const b=r.stops[i];
    push(b.x+o,pts[pts.length-1].y);
    push(b.x+o,b.y+o);
    marks.push(len);
  }
  r.pts=pts;r.marks=marks;r.len=len;
}
function drawRoutes(){
  layers.routes.innerHTML='';
  for(const r of G.routes){
    const p=r.pts.map(q=>q.x+','+q.y).join(' ');
    el('polyline',{points:p,fill:'none',stroke:'#ffffffaa','stroke-width':8,'stroke-linejoin':'round','stroke-linecap':'round'},layers.routes);
    el('polyline',{points:p,fill:'none',stroke:r.color,'stroke-width':5,'stroke-linejoin':'round','stroke-linecap':'round'},layers.routes);
  }
}
function recomputeNetwork(){
  for(const s of G.stops)s.routes=[];
  for(const r of G.routes)for(const s of r.stops)s.routes.push(r);
  G.dist={};
  for(const type in TYPES){
    const d={},q=[];
    for(const r of G.routes)if(r.stops.some(s=>s.type===type)){d[r.id]=0;q.push(r);}
    while(q.length){
      const r=q.shift();
      for(const s of r.stops)for(const o of s.routes)if(d[o.id]===undefined){d[o.id]=d[r.id]+1;q.push(o);}
    }
    G.dist[type]=d;
  }
}
function bestAt(stop,type){
  let best=Infinity;const d=G.dist[type];
  for(const r of stop.routes)if(d[r.id]!==undefined&&d[r.id]<best)best=d[r.id];
  return best;
}
function freeSlot(){
  for(let i=0;i<MAX_ROUTES;i++)if(!G.routes.some(r=>r.slot===i))return i;
  return -1;
}
function createRoute(stops){
  const slot=freeSlot();
  const r={id:G.nextRoute++,slot,color:ROUTE_COLORS[slot],stops};
  buildRoutePath(r);G.routes.push(r);
  recomputeNetwork();drawRoutes();
  if(freeBuses()>0)addBusTo(r);
  G.started=true;
  renderRoutesPanel();
}
function addBusTo(r){
  if(freeBuses()<=0)return;
  // start from whichever end has the fewest buses nearby, so buses spread out
  const onRoute=G.fleet.filter(b=>b.route===r).length,atEnd=onRoute%2===1;
  const idx=atEnd?r.stops.length-1:0;
  const b={route:r,s:r.marks[idx],dir:atEnd?-1:1,next:atEnd?idx-1:1,dwell:.2,riders:[]};
  const outer=el('g',{'pointer-events':'none'},layers.buses);
  b.inner=el('g',{},outer);
  el('rect',{x:-13,y:-7,width:26,height:14,rx:4,fill:r.color,stroke:'#fff','stroke-width':1.5},b.inner);
  el('rect',{x:5,y:-5,width:5,height:10,rx:1,fill:'#dff3ff'},b.inner);
  b.label=el('text',{y:-11,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#17212a',style:'paint-order:stroke;stroke:#fff;stroke-width:3px'},outer);
  b.outer=outer;
  G.fleet.push(b);
  placeBus(b);
}
function dropRiders(b){
  const stop=b.route.stops[Math.max(0,Math.min(b.next,b.route.stops.length-1))];
  for(const p of b.riders){p.born=G.now;stop.wait.push(p);}
  b.riders=[];stop.dirty=true;
}
function removeBus(b){
  dropRiders(b);b.outer.remove();
  G.fleet.splice(G.fleet.indexOf(b),1);
}
function removeBusFrom(r){
  const list=G.fleet.filter(b=>b.route===r);
  if(list.length)removeBus(list[list.length-1]);
  renderRoutesPanel();
}
function deleteRoute(r){
  G.fleet.filter(b=>b.route===r).forEach(removeBus);
  G.routes.splice(G.routes.indexOf(r),1);
  if(G.draw&&G.draw.route===r)G.draw=null;
  recomputeNetwork();drawRoutes();renderRoutesPanel();updateHint();drawPreview();
}

/* ---------- Drawing routes ---------- */
function startDraw(route){
  G.draw={route:route||null,stops:route?[...route.stops]:[],color:route?route.color:ROUTE_COLORS[freeSlot()]};
  updateHint();drawPreview();
}
function clickStop(s){
  if(G.over||G.modal)return;
  if(!G.draw){
    if(G.routes.length>=MAX_ROUTES){flashHint('You have the maximum of 6 routes. Delete one or extend one instead.');return;}
    startDraw(null);
  }
  const d=G.draw,last=d.stops[d.stops.length-1];
  if(s===last){finishDraw();return;}
  if(d.stops.includes(s)){flashHint(`${s.name} is already on this route.`);return;}
  d.stops.push(s);updateHint();drawPreview();
}
function finishDraw(){
  const d=G.draw;if(!d)return;
  G.draw=null;
  if(d.route){
    d.route.stops=d.stops;buildRoutePath(d.route);recomputeNetwork();drawRoutes();renderRoutesPanel();
  }else if(d.stops.length>=2){
    createRoute(d.stops);
  }
  updateHint();drawPreview();
}
function cancelDraw(){G.draw=null;updateHint();drawPreview();}
let pointer=null;
svg.addEventListener('pointermove',e=>{
  if(!G||!G.draw)return;
  const m=svg.getScreenCTM();if(!m)return;
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
  pointer={x:Math.round((p.x-MARGIN)/CELL)*CELL+MARGIN,y:Math.round((p.y-MARGIN)/CELL)*CELL+MARGIN};
  drawPreview();
});
function drawPreview(){
  const g=layers.preview;g.innerHTML='';
  if(!G||!G.draw||!G.draw.stops.length)return;
  const d=G.draw,pts=[];
  d.stops.forEach((s,i)=>{
    if(i)pts.push(s.x+','+d.stops[i-1].y);
    pts.push(s.x+','+s.y);
  });
  el('polyline',{points:pts.join(' '),fill:'none',stroke:d.color,'stroke-width':6,'stroke-linejoin':'round','stroke-linecap':'round',opacity:.85},g);
  const last=d.stops[d.stops.length-1],to=G.hover||pointer;
  if(to)el('polyline',{points:`${last.x},${last.y} ${to.x},${last.y} ${to.x},${to.y}`,fill:'none',stroke:d.color,'stroke-width':4,'stroke-dasharray':'8 8','stroke-linecap':'round'},g);
}

/* ---------- Simulation ---------- */
function spawnTables(h){
  if(h<10.5)return [{home:1},{office:6,school:3,shop:1}];
  if(h<15)return [{home:2,office:1,school:.5,shop:1},{shop:4,home:3,office:2}];
  if(h<19.5)return [{office:5,school:3,shop:1},{home:8,shop:2}];
  return [{shop:2,office:1},{home:1}];
}
function demandCurve(h){
  if(h>=7&&h<9.5)return 1.9;
  if(h>=16&&h<18.5)return 1.9;
  if(h>=10&&h<16)return .75;
  if(h>=18.5&&h<21)return .5;
  return .3;
}
function spawnPassenger(){
  const [oT,dT]=spawnTables(hour());
  const type=weighted(oT);
  const pool=G.stops.filter(s=>s.type===type&&s.grace<=G.now);
  if(!pool.length)return;
  const w={...dT};delete w[type];
  for(const k in w)if(!G.stops.some(s=>s.type===k))delete w[k];
  const dest=weighted(w);if(!dest)return;
  addWaiting(pick(pool),dest);
}
function addWaiting(stop,dest){
  stop.wait.push({dest,born:G.now,patience:rand(52,68)});stop.dirty=true;
}
function step(dt){
  G.now+=dt;G.t+=dt;
  const h=hour();
  const rate=(.48+.15*(G.day-1))*demandCurve(h)*(G.event.id==='rain'?1.2:1);
  G.spawnAcc+=rate*dt;
  while(G.spawnAcc>=1){G.spawnAcc--;spawnPassenger();}
  if(G.event.id==='festival'&&G.festStop&&h>=11&&h<16){
    G.festAcc+=.5*dt;
    while(G.festAcc>=1){G.festAcc--;addWaiting(G.festStop,'home');}
  }
  for(const b of G.fleet)stepBus(b,dt);
  for(const s of G.stops){
    for(let i=s.wait.length-1;i>=0;i--){
      const p=s.wait[i];
      if(G.now-p.born>p.patience){
        s.wait.splice(i,1);s.dirty=true;
        G.gaveUp++;G.dayStats.gaveUp++;G.rating=Math.max(0,G.rating-1.5);
        floatText(s.x,s.y-20,'😠','#b3261e');
      }
    }
  }
  if(G.rating<=0){gameOver('The town has lost all faith in your buses.');return;}
  if(G.t>=DAY)endDay();
}
function stepBus(b,dt){
  if(b.dwell>0){b.dwell-=dt;return;}
  const r=b.route,target=r.marks[b.next],gap=Math.abs(target-b.s),move=busSpeed()*dt;
  if(move>=gap){b.s=target;arrive(b);}
  else b.s+=b.dir*move;
}
function arrive(b){
  const r=b.route,idx=b.next,stop=r.stops[idx];let moved=0;
  // Get off: arrived, or a better connection is here
  for(let i=b.riders.length-1;i>=0;i--){
    const p=b.riders[i];
    if(stop.type===p.dest){b.riders.splice(i,1);deliver(p,stop);moved++;continue;}
    const cur=G.dist[p.dest][r.id];
    if(cur===undefined||bestAt(stop,p.dest)<cur){
      b.riders.splice(i,1);p.born=G.now;p.patience=rand(52,68);stop.wait.push(p);stop.dirty=true;moved++;
    }
  }
  // Get on: only if this route is the best way forward from here
  const cap=capacity();
  for(let i=0;i<stop.wait.length&&b.riders.length<cap;){
    const p=stop.wait[i],d=G.dist[p.dest][r.id];
    if(d!==undefined&&d<=bestAt(stop,p.dest)){
      stop.wait.splice(i,1);b.riders.push(p);stop.dirty=true;moved++;
    }else i++;
  }
  if(idx>=r.stops.length-1)b.dir=-1;else if(idx<=0)b.dir=1;
  b.next=idx+b.dir;
  b.dwell=.3+moved*.05;
}
function deliver(p,stop){
  const fare=FARE*(G.event.id==='payday'?1.5:1);
  G.cash+=fare;G.earned+=fare;G.delivered++;
  G.dayStats.delivered++;G.dayStats.earned+=fare;
  G.rating=Math.min(100,G.rating+.3);
  floatText(stop.x,stop.y-20,'+$'+fare,'#17803d');
}
function floatText(x,y,txt,color){
  if(layers.fx.childElementCount>30)return;
  const g=el('g',{transform:`translate(${x} ${y})`},layers.fx);
  const t=el('text',{class:'float','text-anchor':'middle',fill:color},g);t.textContent=txt;
  setTimeout(()=>g.remove(),900);
}
function placeBus(b){
  const r=b.route;let left=b.s;
  for(let i=1;i<r.pts.length;i++){
    const a=r.pts[i-1],c=r.pts[i],seg=Math.abs(c.x-a.x)+Math.abs(c.y-a.y);
    if(left<=seg||i===r.pts.length-1){
      const f=seg?Math.min(1,left/seg):0;
      const x=a.x+(c.x-a.x)*f,y=a.y+(c.y-a.y)*f;
      let ang=Math.atan2(c.y-a.y,c.x-a.x)*180/Math.PI;
      if(b.dir<0)ang+=180;
      b.outer.setAttribute('transform',`translate(${x} ${y})`);
      b.inner.setAttribute('transform',`rotate(${ang})`);
      break;
    }
    left-=seg;
  }
  const n=b.riders.length;
  if(b.shown!==n){b.shown=n;b.label.textContent=n||'';}
}

/* ---------- Day cycle ---------- */
function endDay(){
  const upkeep=G.owned*UPKEEP,ds=G.dayStats,finished=G.day;
  G.cash-=upkeep;
  if(G.cash<-200){gameOver('The bus company ran out of money.');return;}
  G.day++;G.t=0;G.spawnAcc=0;G.festAcc=0;
  G.dayStats={delivered:0,gaveUp:0,earned:0};
  const added=[];
  const count=G.stops.length>=MAX_STOPS?0:1+(G.day%2===0?1:0);
  for(let i=0;i<count;i++){
    let bestT='home',bestV=Infinity;
    for(const k in TYPES){
      const v=G.stops.filter(s=>s.type===k).length/TYPES[k].weight;
      if(v<bestV){bestV=v;bestT=k;}
    }
    const s=addStop(bestT);if(s)added.push(s);
  }
  G.event=pick(EVENTS);
  const shops=G.stops.filter(s=>s.type==='shop');
  G.festStop=G.event.id==='festival'?pick(shops):null;
  const desc=G.festStop?`Crowds pour out of ${G.festStop.name} from 11:00 to 16:00.`:G.event.desc;
  G.eventDesc=desc;
  const newList=added.map(s=>`${TYPES[s.type].emoji} ${s.name}`).join(', ');
  showModal(`<h2>Day ${finished} report</h2>
    <table>
      <tr><td>Passengers delivered</td><td>${ds.delivered}</td></tr>
      <tr><td>Passengers who gave up</td><td>${ds.gaveUp}</td></tr>
      <tr><td>Fares earned</td><td>$${Math.round(ds.earned)}</td></tr>
      <tr><td>Bus upkeep (${G.owned} × $${UPKEEP})</td><td>−$${upkeep}</td></tr>
      <tr><td>Cash now</td><td>$${Math.round(G.cash)}</td></tr>
    </table>
    ${newList?`<p><b>New stops:</b> ${newList}. They flash on the map, and passengers appear there in about 25 seconds.</p>`:''}
    <p><b>Tomorrow: ${G.event.name}.</b> ${desc}</p>
    <button class="primary" id="modalOk">Start day ${G.day}</button>`);
}
function gameOver(reason){
  G.over=true;
  const best=Math.max(readBest(),G.delivered);saveBest(best);
  showModal(`<h2>Game over</h2>
    <p>${reason}</p>
    <table>
      <tr><td>Days survived</td><td>${G.day}</td></tr>
      <tr><td>Passengers delivered</td><td>${G.delivered}</td></tr>
      <tr><td>Your best</td><td>${best}</td></tr>
    </table>
    <button class="primary" id="modalOk">Play again</button>`,newGame);
}
function showModal(html,cb){
  G.modal=true;
  $('modal').innerHTML=html;
  $('modalBack').style.display='flex';
  const ok=$('modalOk');
  ok.onclick=()=>{$('modalBack').style.display='none';G.modal=false;if(cb)cb();};
  ok.focus();
}

/* ---------- UI ---------- */
function updateHint(){
  const h=$('hint');h.innerHTML='';
  if(!G)return;
  if(G.draw){
    const n=G.draw.stops.length,span=document.createElement('span');
    span.textContent=G.draw.route?'Click more stops to add to the end of this route.':n<2?'Now click the next stop for this route.':'Keep adding stops, or click the last stop again to finish.';
    h.appendChild(span);
    const min=G.draw.route?G.draw.route.stops.length+1:2;
    if(n>=min){const ok=document.createElement('button');ok.textContent='Done';ok.onclick=finishDraw;h.appendChild(ok);}
    const no=document.createElement('button');no.textContent='Cancel';no.onclick=cancelDraw;h.appendChild(no);
  }else if(!G.started){
    h.textContent='Click a stop to start your first route. The clock starts once it is finished.';
  }
}
let hintTimer;
function flashHint(msg){
  $('hint').textContent=msg;
  clearTimeout(hintTimer);hintTimer=setTimeout(updateHint,1800);
}
function renderRoutesPanel(){
  const box=$('routes');box.innerHTML='';
  if(!G.routes.length){box.innerHTML='<div id="noRoutes">No routes yet. Click a stop on the map to draw one.</div>';}
  for(const r of G.routes){
    const n=G.fleet.filter(b=>b.route===r).length;
    const row=document.createElement('div');row.className='route';
    row.innerHTML=`<span class="sw" style="background:${r.color}"></span>
      <span>Route ${r.slot+1} <small>· ${r.stops.length} stops</small>${n?'':' <small class="warn">no bus!</small>'}</span>
      <span class="ctl"><button aria-label="Remove bus" ${n?'':'disabled'}>−</button><b>${n}</b><button aria-label="Add bus" ${freeBuses()>0?'':'disabled'}>+</button></span>
      <span></span>
      <span class="act"><button>Extend</button><button>Delete</button></span>`;
    const btn=row.querySelectorAll('button');
    btn[0].onclick=()=>removeBusFrom(r);
    btn[1].onclick=()=>{addBusTo(r);renderRoutesPanel();};
    btn[2].onclick=()=>startDraw(r);
    btn[3].onclick=()=>deleteRoute(r);
    box.appendChild(row);
  }
  const free=freeBuses(),count=$('busCount');
  count.textContent=`${free} of ${G.owned} buses free`;
  count.style.color=free>0&&G.routes.length?'var(--amber)':'';
  count.style.fontWeight=free>0&&G.routes.length?'700':'';
}
function renderStats(){
  $('day').textContent=G.day;
  const h=hour(),hh=Math.floor(h),mm=Math.floor((h-hh)*60/10)*10;
  $('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const rush=(h>=7&&h<9.5)||(h>=16&&h<18.5);
  $('event').textContent=(rush?'🚦 Rush hour!  ':'')+(G.day>1?G.event.name:'');
  $('cash').textContent=(G.cash<0?'−$':'$')+Math.abs(Math.round(G.cash));
  $('cash').style.color=G.cash<0?'var(--bad)':'';
  let waiting=0;for(const s of G.stops)waiting+=s.wait.length;
  $('waiting').textContent=waiting;
  $('delivered').textContent=G.delivered;
  $('gaveUp').textContent=G.gaveUp;
  const rate=Math.round(G.rating);
  $('ratingTxt').textContent=rate+'%';
  const bar=$('ratingBar');bar.style.width=G.rating+'%';
  bar.style.background=G.rating<25?'var(--bad)':G.rating<50?'var(--amber)':'var(--good)';
  shopBtn('buyBus','Buy a bus',busCost(),false);
  shopBtn('buyCap',`Bigger buses (${capacity()} → ${capacity()+4} seats)`,capCost(),G.capLevel>=3);
  shopBtn('buySpeed',`Faster engines (+15%)`,speedCost(),G.speedLevel>=3);
  // Night tint
  let dark=0;
  if(h<6.5)dark=(6.5-h)/1.5*.32; else if(h>18.5)dark=Math.min(.32,(h-18.5)/2*.32);
  tintRect.setAttribute('opacity',dark);
}
function shopBtn(id,label,cost,maxed){
  const b=$(id),html=maxed?`<span>${label.split(' (')[0]}</span><b>Maxed</b>`:`<span>${label}</span><b>$${cost}</b>`;
  if(b.dataset.h!==html){b.innerHTML=html;b.dataset.h=html;}
  b.disabled=maxed||G.cash<cost;
}
function setSpeed(s){
  G.speed=s;if(s>0)G.lastSpeed=s;
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
}
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.s)));
$('buyBus').onclick=()=>{const c=busCost();if(G.cash>=c){G.cash-=c;G.owned++;renderRoutesPanel();}};
$('buyCap').onclick=()=>{const c=capCost();if(G.cash>=c&&G.capLevel<3){G.cash-=c;G.capLevel++;}};
$('buySpeed').onclick=()=>{const c=speedCost();if(G.cash>=c&&G.speedLevel<3){G.cash-=c;G.speedLevel++;}};
addEventListener('keydown',e=>{
  if(!G||G.modal)return;
  if(e.code==='Space'){e.preventDefault();setSpeed(G.speed===0?G.lastSpeed:0);}
  else if(e.key==='Escape')cancelDraw();
  else if(e.key==='Enter'&&G.draw){e.preventDefault();finishDraw();}
  else if(e.key==='1'||e.key==='2'||e.key==='3')setSpeed(+e.key);
});

/* ---------- Main loop ---------- */
let lastT=performance.now(),uiT=0;
function frame(now){
  const real=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(G&&!G.modal&&!G.over&&G.started&&G.speed>0)step(real*G.speed);
  if(G){
    for(const b of G.fleet)placeBus(b);
    for(const s of G.stops){
      if(s.dirty)renderWaiting(s);
      let worst=0;
      for(const p of s.wait){const a=(G.now-p.born)/p.patience;if(a>worst)worst=a;}
      s.ring.setAttribute('stroke-dasharray',worst>.4?`${(worst-.4)/.6} 1`:'0 1');
      if(s.pulse&&s.grace<=G.now){s.pulse.remove();s.pulse=null;}
    }
    uiT+=real;
    if(uiT>.15){uiT=0;renderStats();}
  }
  requestAnimationFrame(frame);
}

newGame();
renderStats();
showModal(`<h2>🚌 Bus Driver Dispatcher</h2>
  <p>You run the buses in a growing town. Get people where they're going before they give up and walk.</p>
  <ul>
    <li><b>Draw routes:</b> click stops one after another, then click the last stop again to finish. Buses shuttle back and forth along each route.</li>
    <li><b>Read the crowd:</b> each dot is a passenger, and its color shows where they want to go. People can change buses where routes share a stop.</li>
    <li><b>Beat the rush:</b> commuters head to work around 07:00 and home around 16:00. A red ring means someone at that stop is about to give up.</li>
    <li><b>Grow:</b> spend your fares on more buses and upgrades. New stops appear every day, so connect them.</li>
  </ul>
  <p>Too many people giving up drops your town approval. At 0%, you're fired.</p>
  <button class="primary" id="modalOk">Start dispatching</button>`);
requestAnimationFrame(frame);
</script>
